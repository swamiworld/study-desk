<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4BD8">
<title>Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light;
  --bg:#FFF6E8; --surface:#FFFFFF; --ink:#16204A; --muted:#58608C;
  --doodles:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27220%27%20height%3D%27220%27%20viewBox%3D%270%200%20220%20220%27%3E%0A%3Cg%20opacity%3D%27.55%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20stroke-width%3D%273%27%3E%0A%3Cpolygon%20points%3D%2736%2C18%2041%2C31%2055%2C31%2044%2C40%2048%2C54%2036%2C46%2024%2C54%2028%2C40%2017%2C31%2031%2C31%27%20fill%3D%27%23FFC94D%27%20stroke%3D%27none%27%2F%3E%0A%3Ccircle%20cx%3D%27120%27%20cy%3D%2728%27%20r%3D%277%27%20fill%3D%27%23FF9FB8%27%20stroke%3D%27none%27%2F%3E%0A%3Cpath%20d%3D%27M168%2044%20q8%20-12%2016%200%20t16%200%27%20stroke%3D%27%237FC8F8%27%2F%3E%0A%3Cpath%20d%3D%27M76%2088%20v16%20M68%2096%20h16%27%20stroke%3D%27%238EDDB5%27%2F%3E%0A%3Cg%20transform%3D%27translate%28150%20118%29%20rotate%2840%29%27%3E%3Crect%20width%3D%2710%27%20height%3D%2736%27%20rx%3D%272%27%20fill%3D%27%23FFC94D%27%20stroke%3D%27none%27%2F%3E%3Cpolygon%20points%3D%270%2C36%2010%2C36%205%2C48%27%20fill%3D%27%23B79CFF%27%20stroke%3D%27none%27%2F%3E%3C%2Fg%3E%0A%3Cg%20transform%3D%27translate%2822%20132%29%27%3E%3Crect%20width%3D%2734%27%20height%3D%2726%27%20rx%3D%274%27%20fill%3D%27%23FF9FB8%27%20stroke%3D%27none%27%2F%3E%3Cpath%20d%3D%27M17%200%20v26%27%20stroke%3D%27%23B79CFF%27%2F%3E%3C%2Fg%3E%0A%3Ccircle%20cx%3D%27100%27%20cy%3D%27172%27%20r%3D%275%27%20fill%3D%27%237FC8F8%27%20stroke%3D%27none%27%2F%3E%0A%3Cpolygon%20points%3D%27190%2C186%20194%2C198%20206%2C198%20196%2C205%20200%2C216%20190%2C209%20180%2C216%20184%2C205%20174%2C198%20186%2C198%27%20fill%3D%27%238EDDB5%27%20stroke%3D%27none%27%2F%3E%0A%3Cpath%20d%3D%27M18%20200%20q8%20-12%2016%200%20t16%200%27%20stroke%3D%27%23FF9FB8%27%2F%3E%0A%3Ccircle%20cx%3D%27202%27%20cy%3D%2798%27%20r%3D%274%27%20fill%3D%27%238EDDB5%27%20stroke%3D%27none%27%2F%3E%0A%3Ccircle%20cx%3D%2764%27%20cy%3D%2752%27%20r%3D%273%27%20fill%3D%27%237FC8F8%27%20stroke%3D%27none%27%2F%3E%0A%3C%2Fg%3E%3C%2Fsvg%3E");
  --gold:#F5B700; --pink:#F06292; --shadow:rgba(47,75,216,.12);
  --line:#E6D8F4; --accent:#2F4BD8; --accent-ink:#FFFFFF; --due:#E59A00; --due-soft:#FFF1D2;
  --ok:#1F7A4D; --ok-soft:#DDF3E7; --bad:#B8362E; --bad-soft:#FBE3E0; --nav:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1538; --surface:#161F45; --ink:#E7ECF8; --muted:#9AA6CC;
    --doodles:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27220%27%20height%3D%27220%27%20viewBox%3D%270%200%20220%20220%27%3E%0A%3Cg%20opacity%3D%27.20%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20stroke-width%3D%273%27%3E%0A%3Cpolygon%20points%3D%2736%2C18%2041%2C31%2055%2C31%2044%2C40%2048%2C54%2036%2C46%2024%2C54%2028%2C40%2017%2C31%2031%2C31%27%20fill%3D%27%23FFC94D%27%20stroke%3D%27none%27%2F%3E%0A%3Ccircle%20cx%3D%27120%27%20cy%3D%2728%27%20r%3D%277%27%20fill%3D%27%23FF9FB8%27%20stroke%3D%27none%27%2F%3E%0A%3Cpath%20d%3D%27M168%2044%20q8%20-12%2016%200%20t16%200%27%20stroke%3D%27%237FC8F8%27%2F%3E%0A%3Cpath%20d%3D%27M76%2088%20v16%20M68%2096%20h16%27%20stroke%3D%27%238EDDB5%27%2F%3E%0A%3Cg%20transform%3D%27translate%28150%20118%29%20rotate%2840%29%27%3E%3Crect%20width%3D%2710%27%20height%3D%2736%27%20rx%3D%272%27%20fill%3D%27%23FFC94D%27%20stroke%3D%27none%27%2F%3E%3Cpolygon%20points%3D%270%2C36%2010%2C36%205%2C48%27%20fill%3D%27%23B79CFF%27%20stroke%3D%27none%27%2F%3E%3C%2Fg%3E%0A%3Cg%20transform%3D%27translate%2822%20132%29%27%3E%3Crect%20width%3D%2734%27%20height%3D%2726%27%20rx%3D%274%27%20fill%3D%27%23FF9FB8%27%20stroke%3D%27none%27%2F%3E%3Cpath%20d%3D%27M17%200%20v26%27%20stroke%3D%27%23B79CFF%27%2F%3E%3C%2Fg%3E%0A%3Ccircle%20cx%3D%27100%27%20cy%3D%27172%27%20r%3D%275%27%20fill%3D%27%237FC8F8%27%20stroke%3D%27none%27%2F%3E%0A%3Cpolygon%20points%3D%27190%2C186%20194%2C198%20206%2C198%20196%2C205%20200%2C216%20190%2C209%20180%2C216%20184%2C205%20174%2C198%20186%2C198%27%20fill%3D%27%238EDDB5%27%20stroke%3D%27none%27%2F%3E%0A%3Cpath%20d%3D%27M18%20200%20q8%20-12%2016%200%20t16%200%27%20stroke%3D%27%23FF9FB8%27%2F%3E%0A%3Ccircle%20cx%3D%27202%27%20cy%3D%2798%27%20r%3D%274%27%20fill%3D%27%238EDDB5%27%20stroke%3D%27none%27%2F%3E%0A%3Ccircle%20cx%3D%2764%27%20cy%3D%2752%27%20r%3D%273%27%20fill%3D%27%237FC8F8%27%20stroke%3D%27none%27%2F%3E%0A%3C%2Fg%3E%3C%2Fsvg%3E");
    --gold:#FFD54A; --pink:#FF8FB1; --shadow:rgba(0,0,0,.35);
    --line:#2C3868; --accent:#7D93FF; --accent-ink:#0D1430; --due:#FFB938; --due-soft:#3A2C0C;
    --ok:#5BD69A; --ok-soft:#123326; --bad:#FF8A80; --bad-soft:#3A1715; --nav:#141C3D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1538; --surface:#161F45; --ink:#E7ECF8; --muted:#9AA6CC;
  --doodles:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27220%27%20height%3D%27220%27%20viewBox%3D%270%200%20220%20220%27%3E%0A%3Cg%20opacity%3D%27.20%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20stroke-width%3D%273%27%3E%0A%3Cpolygon%20points%3D%2736%2C18%2041%2C31%2055%2C31%2044%2C40%2048%2C54%2036%2C46%2024%2C54%2028%2C40%2017%2C31%2031%2C31%27%20fill%3D%27%23FFC94D%27%20stroke%3D%27none%27%2F%3E%0A%3Ccircle%20cx%3D%27120%27%20cy%3D%2728%27%20r%3D%277%27%20fill%3D%27%23FF9FB8%27%20stroke%3D%27none%27%2F%3E%0A%3Cpath%20d%3D%27M168%2044%20q8%20-12%2016%200%20t16%200%27%20stroke%3D%27%237FC8F8%27%2F%3E%0A%3Cpath%20d%3D%27M76%2088%20v16%20M68%2096%20h16%27%20stroke%3D%27%238EDDB5%27%2F%3E%0A%3Cg%20transform%3D%27translate%28150%20118%29%20rotate%2840%29%27%3E%3Crect%20width%3D%2710%27%20height%3D%2736%27%20rx%3D%272%27%20fill%3D%27%23FFC94D%27%20stroke%3D%27none%27%2F%3E%3Cpolygon%20points%3D%270%2C36%2010%2C36%205%2C48%27%20fill%3D%27%23B79CFF%27%20stroke%3D%27none%27%2F%3E%3C%2Fg%3E%0A%3Cg%20transform%3D%27translate%2822%20132%29%27%3E%3Crect%20width%3D%2734%27%20height%3D%2726%27%20rx%3D%274%27%20fill%3D%27%23FF9FB8%27%20stroke%3D%27none%27%2F%3E%3Cpath%20d%3D%27M17%200%20v26%27%20stroke%3D%27%23B79CFF%27%2F%3E%3C%2Fg%3E%0A%3Ccircle%20cx%3D%27100%27%20cy%3D%27172%27%20r%3D%275%27%20fill%3D%27%237FC8F8%27%20stroke%3D%27none%27%2F%3E%0A%3Cpolygon%20points%3D%27190%2C186%20194%2C198%20206%2C198%20196%2C205%20200%2C216%20190%2C209%20180%2C216%20184%2C205%20174%2C198%20186%2C198%27%20fill%3D%27%238EDDB5%27%20stroke%3D%27none%27%2F%3E%0A%3Cpath%20d%3D%27M18%20200%20q8%20-12%2016%200%20t16%200%27%20stroke%3D%27%23FF9FB8%27%2F%3E%0A%3Ccircle%20cx%3D%27202%27%20cy%3D%2798%27%20r%3D%274%27%20fill%3D%27%238EDDB5%27%20stroke%3D%27none%27%2F%3E%0A%3Ccircle%20cx%3D%2764%27%20cy%3D%2752%27%20r%3D%273%27%20fill%3D%27%237FC8F8%27%20stroke%3D%27none%27%2F%3E%0A%3C%2Fg%3E%3C%2Fsvg%3E");
  --gold:#FFD54A; --pink:#FF8FB1; --shadow:rgba(0,0,0,.35);
  --line:#2C3868; --accent:#7D93FF; --accent-ink:#0D1430; --due:#FFB938; --due-soft:#3A2C0C;
  --ok:#5BD69A; --ok-soft:#123326; --bad:#FF8A80; --bad-soft:#3A1715; --nav:#141C3D;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0;
  background-color:var(--bg);
  background-image:var(--doodles);
  background-size:220px 220px;
  color:var(--ink);
  font:400 1rem/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
.wrap{max-width:680px;margin:0 auto;padding:1.25rem 1rem calc(6rem + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700;margin:1.6rem 0 .6rem}
h3{font-size:1.05rem}
.sub{color:var(--muted);margin:.25rem 0 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:.65rem 1rem;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:.4rem .75rem;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:.25rem 0}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1rem;box-shadow:0 3px 0 var(--shadow)}
.stack{display:flex;flex-direction:column;gap:.6rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.75rem}
.banner{background:var(--due-soft);border:1px solid var(--due);border-radius:10px;padding:.6rem .8rem;font-size:.92rem;margin-bottom:1rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:.1rem .55rem;margin-right:.35rem;white-space:nowrap}
.pill.due{background:var(--due-soft);border:1px solid var(--due)}
.pill.new{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:.78rem;font-weight:700;border-radius:6px;padding:.05rem .45rem;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
/* segmented */
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.4rem .8rem;font-weight:700;color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:default}
/* hours */
.hours{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.hours strong{font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;line-height:1}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:.6rem 0 .3rem;position:relative}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.done i{background:var(--ok)}
/* tasks */
.task{display:flex;gap:.65rem;align-items:flex-start;padding:.55rem 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:1.25rem;height:1.25rem;margin-top:.15rem;accent-color:var(--ok);flex:none}
.task .txt{flex:1}
.task.done .txt span{text-decoration:line-through;color:var(--muted)}
.task .del{background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;padding:.1rem .3rem}
.addform{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;margin-top:.75rem}
.addform select,.addform input,.field{border:1.5px solid var(--line);border-radius:10px;padding:.55rem .6rem;background:var(--surface);min-width:0}
@media (max-width:420px){.addform{grid-template-columns:1fr auto}.addform select{grid-column:1 / -1}}
/* day nav */
.daynav{display:flex;align-items:center;gap:.5rem}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:2.2rem;height:2.2rem;font-weight:700}
/* let's go */
.goline{font-family:"Bricolage Grotesque",sans-serif;font-size:1.9rem;font-weight:700;text-align:center;line-height:1.2;margin:.4rem 0}
.goline.ok{color:var(--ok);font-size:1.15rem}
.session{display:flex;justify-content:space-between;gap:.5rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.session:last-child{border-bottom:0}
/* practice */
.ch{display:grid;grid-template-columns:2.4rem 1fr;gap:.75rem;align-items:start}
.chnum{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.6rem;color:var(--accent);line-height:1}
.status{color:var(--muted);font-size:.9rem;margin:.25rem 0 .6rem}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:.2rem}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ok)}
.dots i.on{background:var(--ok)}
.duebtn{display:flex;justify-content:space-between;align-items:center;gap:.75rem;width:100%;text-align:left;border:1px solid var(--line);background:var(--due-soft);border-radius:10px;padding:.7rem .85rem}
.duebtn span{color:var(--muted);font-size:.9rem;white-space:nowrap}
/* quiz */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:.5rem 0 1rem}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:1.12rem;font-weight:700;margin:0 0 1rem}
.opt{display:flex;gap:.65rem;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.7rem .85rem}
.opt .k{font-weight:700;color:var(--muted);min-width:1.2rem}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{margin-top:1rem;border-radius:10px;padding:.85rem;border:1px solid var(--line);background:var(--bg)}
.feedback b{display:block;margin-bottom:.25rem}
.feedback.ok b{color:var(--ok)} .feedback.bad b{color:var(--bad)}
.hint{margin-top:.75rem;color:var(--muted);font-style:italic}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:3.2rem;font-weight:700;line-height:1}
.score small{font-size:1.2rem;color:var(--muted);font-weight:500}
.wq{border-left:4px solid var(--bad);padding:.5rem .75rem;background:var(--surface);border-radius:0 10px 10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.wq p{margin:.2rem 0}
.wq .ans{color:var(--ok);font-weight:700}
.wq .ex{color:var(--muted);font-size:.92rem}
.card{min-height:16rem;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.card .lbl{color:var(--muted);font-size:.85rem;margin-bottom:.5rem}
.card .big{font-size:1.12rem;font-weight:700}
.card .ans{color:var(--ok);font-size:1.25rem;font-weight:700;margin-bottom:.6rem}
.card .ex{color:var(--muted)}
/* week */
.weekrow{display:grid;grid-template-columns:4.2rem 1fr 4.5rem;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.weekrow:last-child{border-bottom:0}
.weekrow .meter{margin:0}
.weekrow .tgt{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
.small{font-size:.88rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.6rem;text-align:center}
.stat strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem}
.stat span{font-size:.8rem;color:var(--muted)}
table.prog{width:100%;border-collapse:collapse;font-size:.9rem}
table.prog th,table.prog td{text-align:left;padding:.4rem .3rem;border-bottom:1px solid var(--line)}
table.prog th{color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}
/* study */
.mat{display:flex;justify-content:space-between;align-items:center;gap:.75rem;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.7rem .85rem}
.mat span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.pdfbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:.4rem 0 .6rem;border-bottom:1px solid var(--line)}
.pdfbar h2{margin:.25rem 0 .5rem;font-size:1.05rem}
.pdfbar .field{padding:.35rem .4rem;min-width:0}
.pdfscroll{overflow-x:auto}
/* stickers and celebration */
.gift{margin-left:.2rem}
.stickers{display:flex;flex-wrap:wrap;gap:.6rem}
.sticker{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.5rem .7rem;text-align:center;min-width:4.4rem;box-shadow:0 3px 0 var(--shadow)}
.sticker span{display:block;font-size:2.2rem;line-height:1.15}
.sticker small{color:var(--muted)}
.gift-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(22,32,74,.55);overflow:hidden;animation:ovin .25s ease-out}
.gift-card{position:relative;z-index:2;width:min(92vw,360px);background:var(--surface);border:3px solid var(--accent);border-radius:26px;padding:1.4rem 1.2rem;text-align:center;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.gift-card.L4{border-color:var(--gold);box-shadow:0 0 40px var(--gold)}
.gift-card .top{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;font-size:1.7rem;font-weight:700;line-height:1.2}
.gift-card p{margin:.3rem 0}
.gift-emoji{display:inline-block;font-size:5.5rem;line-height:1.1;margin:.4rem 0;animation:bob 1.6s ease-in-out infinite}
.gift-card.L3 .gift-emoji,.gift-card.L4 .gift-emoji{filter:drop-shadow(0 0 14px var(--gold))}
.gift-banner{display:inline-block;background:var(--gold);color:#16204A;font-weight:700;border-radius:999px;padding:.15rem .9rem;margin-bottom:.4rem}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
.confetti i:nth-child(6n+1){background:var(--accent)} .confetti i:nth-child(6n+2){background:var(--pink)} .confetti i:nth-child(6n+3){background:var(--gold)}
.confetti i:nth-child(6n+4){background:var(--ok)} .confetti i:nth-child(6n+5){background:var(--due)} .confetti i:nth-child(6n){background:var(--bad)}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;animation:burst 1.2s ease-out forwards}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(.3);opacity:0}}
@media (prefers-reduced-motion: reduce){.gift-ov,.gift-card,.gift-emoji{animation:none}.confetti{display:none}}
.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem;color:var(--muted)}
.pdfpage{background:#fff;border:1px solid var(--line);border-radius:6px;margin:.6rem 0;overflow:hidden;scroll-margin-top:8rem}
.pdfpage canvas{display:block;width:100%;height:auto}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{background:none;border:0;padding:.7rem .2rem .8rem;font-weight:700;color:var(--muted);font-size:.92rem}
nav.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:1rem}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"><p class="sub">Loading…</p></div>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>

<script src="config.js"></script>
<script src="content.js"></script>
<script type="module">
const CFG = window.APP_CONFIG, CONTENT = window.CONTENT;
const FB_VER = "10.12.2";
const DEMO = !CFG.firebase.apiKey || CFG.firebase.apiKey.startsWith("PASTE");
// config.js lists the students; an older config with a single studentEmail still works
const STUDENTS = (CFG.students && CFG.students.length ? CFG.students : [{email:CFG.studentEmail, name:CFG.studentName||"Student"}])
  .map(x=>({email:String(x.email).toLowerCase(), name:x.name||"Student", subjects:x.subjects, practice:x.practice, study:x.study}));
const PARENTS = CFG.parentEmails.map(e=>e.toLowerCase());
// Subjects with a question bank come from content.js; config.extraSubjects are planner-only (no quizzes).
// A student with a `subjects` list in config.js sees only those; `practice:false` / `study:false` hide those tabs for that student.
const SUBJECT_NAMES = Object.fromEntries([...CONTENT.subjects, ...(CFG.extraSubjects||[])].map(x=>[x.id,x.name]));
const studentCfg = () => STUDENTS.find(x=>x.email===currentStudent) || STUDENTS[0];
const subjectIds = () => studentCfg().subjects || CONTENT.subjects.map(x=>x.id);
const planSubjects = () => [...subjectIds().map(id=>[id, SUBJECT_NAMES[id]||id]), ["other","Other"]];
const hasPractice = () => studentCfg().practice!==false;
const hasStudy = () => studentCfg().study!==false;

/* ================= helpers ================= */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pad = n => String(n).padStart(2,"0");
const todayStr = (d=new Date()) => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return todayStr(d); };
const diffDays = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const fmtShort = s => parseD(s).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const fmtLong = s => parseD(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
const fmtDow = s => parseD(s).toLocaleDateString(undefined,{weekday:"short"});
const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
const hm = mins => { mins=Math.round(mins); const h=Math.floor(mins/60), m=mins%60; return h ? (m? h+" h "+m+" min" : h+" h") : m+" min"; };
const uid = () => Math.random().toString(36).slice(2,10);
const APP_VERSION = "2026-10-20";
const versionLine = () => `<p class="small" style="text-align:center;margin-top:2rem">Study Desk, version ${APP_VERSION}</p>`;
// A focus session of GIFT_MIN minutes or more, pressed Stop by her, earns one sticker. The sticker is derived from the session id, so nothing extra is stored.
const GIFT_MIN = CFG.giftMinutes || 15;
const STICKERS = ["🚀","🏆","🌈","🦄","🐼","🦊","🐬","🦋","🌟","🎈","🍀","🎨","📚","🧠","🐯","🐸","🐧","🦉","🐢","🍉","🍦","🎸","⚽","🎯"];
const stickerOf = id => { let h=0; for(const ch of String(id)) h=(h*31+ch.charCodeAt(0))>>>0; return STICKERS[h%STICKERS.length]; };
const earnsSticker = x => x.minutes>=GIFT_MIN && x.by!=="parent";
const isWeekend = s => { const d=parseD(s).getDay(); return d===0||d===6; };

/* ================= storage ================= */
// Firestore layout: students/{email}/state/progress  and  students/{email}/days/{YYYY-MM-DD}
function localStore(email){
  const K = "study-desk-v1:" + (email && email!==STUDENTS[0].email ? email+":" : "");
  const get = k => { try{ const v=localStorage.getItem(K+k); return v?JSON.parse(v):null; }catch(e){ return null; } };
  const set = (k,v) => { try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} };
  return {
    async getProgress(){ return get("progress"); },
    async saveProgress(p){ set("progress", p); },
    async getDay(d){ return get("day:"+d); },
    async saveDay(d,data){ set("day:"+d, {...(get("day:"+d)||{}), ...data}); },
    async addSession(d,s){ const x=get("day:"+d)||{}; x.sessions=[...(x.sessions||[]), s]; set("day:"+d, x); },
    async removeSession(d,s){ const x=get("day:"+d)||{}; x.sessions=(x.sessions||[]).filter(e=>e.id!==s.id); set("day:"+d, x); },
    // demo mode: this device is the only device, so the cached run is the run
    async getRun(){ try{ const x=JSON.parse(localStorage.getItem(TKEY)); return x && x.phase==="focus" ? x : null; }catch(e){ return null; } },
    async putRun(r){}, async clearRun(){}
  };
}
async function firebaseStore(fs, db, email){
  const base = "students/"+email;
  return {
    async getProgress(){ const s=await fs.getDoc(fs.doc(db, base+"/state/progress")); return s.exists()? s.data() : null; },
    async saveProgress(p){ await fs.setDoc(fs.doc(db, base+"/state/progress"), p); },
    async getDay(d){ const s=await fs.getDoc(fs.doc(db, base+"/days/"+d)); return s.exists()? s.data() : null; },
    async saveDay(d,data){ await fs.setDoc(fs.doc(db, base+"/days/"+d), data, {merge:true}); },
    async addSession(d,s){ await fs.setDoc(fs.doc(db, base+"/days/"+d), {sessions: fs.arrayUnion(s)}, {merge:true}); },
    async removeSession(d,s){ await fs.updateDoc(fs.doc(db, base+"/days/"+d), {sessions: fs.arrayRemove(s)}); },
    async getRun(){ const x=await fs.getDoc(fs.doc(db, base+"/state/run")); return x.exists()? x.data() : null; },
    async putRun(r){ await fs.setDoc(fs.doc(db, base+"/state/run"), r); },
    async clearRun(){ await fs.deleteDoc(fs.doc(db, base+"/state/run")); }
  };
}

/* ================= app state ================= */
let store = null, role = null, authApi = null, me = null, loginMsg = "";
let currentStudent = null;    // whose data is on screen: her own email, or the one the parent picked
let makeStore = null;         // email -> store for that student
let progress = null;          // {items:{}, mistakes:{}, updatedAt}
const days = {};              // cache: date -> {type, tasks, sessions}
let saveErr = "";

const studentName = () => (STUDENTS.find(x=>x.email===currentStudent)||STUDENTS[0]).name;
async function switchStudent(email){
  if(role!=="parent" || email===currentStudent || !STUDENTS.some(x=>x.email===email)) return;
  currentStudent = email;
  try{ localStorage.setItem("study-desk-parent-student", email); }catch(e){}
  store = await makeStore(email);
  for(const k in days) delete days[k];
  try{ progress = (await store.getProgress()) || blankProgress(); }catch(e){ console.error(e); progress = blankProgress(); }
  progress.items = progress.items||{}; progress.mistakes = progress.mistakes||{};
  render();     // render() moves to the first screen if the current tab does not exist for this student
}
function blankProgress(){ return {items:{}, mistakes:{}, updatedAt:0}; }
function blankDay(d){ return {type: isWeekend(d) ? "holiday" : "school", tasks:[], sessions:[], carried:false}; }
async function loadDay(d, force){
  if(days[d] && !force) return days[d];
  let v = null;
  try{ v = await store.getDay(d); }catch(e){ console.error(e); }
  days[d] = Object.assign(blankDay(d), v || {});
  // one run can be saved twice (double tap, or Stop on two devices at once): keep one row per start time
  const seen = new Set();
  days[d].sessions = (days[d].sessions||[]).filter(s=>{ if(seen.has(s.start)) return false; seen.add(s.start); return true; });
  return days[d];
}
async function saveDay(d){
  if(role!=="student") return;
  try{ const {sessions, ...rest} = days[d]; await store.saveDay(d, rest); saveErr=""; }catch(e){ console.error(e); saveErr="Could not save. Check your internet connection."; showSaveErr(); }
}
let progTimer=null;
function saveProgress(){
  if(role!=="student") return;
  progress.updatedAt = Date.now();
  clearTimeout(progTimer);
  progTimer = setTimeout(async ()=>{
    try{ await store.saveProgress(JSON.parse(JSON.stringify(progress))); saveErr=""; }
    catch(e){ console.error(e); saveErr="Could not save. Check your internet connection."; showSaveErr(); }
  }, 400);
}
function showSaveErr(){ const el=document.getElementById("saveerr"); if(el){ el.textContent=saveErr; el.hidden=!saveErr; } }
const minutesOf = day => (day.sessions||[]).reduce((a,s)=>a+(s.minutes||0),0);
const targetOf = day => CFG.targets[day.type] || CFG.targets.school;

/* ================= practice model ================= */
function chapterList(){ const out=[]; CONTENT.subjects.forEach(s=>s.chapters.forEach(c=>out.push({sid:s.id, sname:s.name, ...c, key:s.id+"/"+c.n}))); return out; }
function chapterByKey(key){ const [sid,n]=key.split("/"); const s=CONTENT.subjects.find(x=>x.id===sid); const c=s.chapters.find(x=>String(x.n)===n); return {sid, sname:s.name, ...c, key}; }
function item(key){ return progress.items[key]; }
function levelOf(key){ const it=item(key); return it? it.level : 0; }
function isDue(key){ const it=item(key); return !!(it && it.next && diffDays(it.next, todayStr())>=0); }
function qOf(key, level, i){ const c=chapterByKey(key); const r=c.levels[level][i]; return {key, level, i, id:key+"/"+level+"/"+i, text:r[0], opts:r[1], ans:r[2], ex:r[3], hint:r[4]||""}; }
function questionsFor(key){ const c=chapterByKey(key); const lv=Math.min(levelOf(key), c.levels.length-1); return c.levels[lv].map((_,i)=>qOf(key,lv,i)); }

/* ================= focus sessions (survive reloads) ================= */
// No countdown. She presses Start and Stop; the start time is kept in localStorage so a reload or a locked phone loses nothing.
const TKEY = "study-desk-timer";
let run = loadRun();
function loadRun(){
  try{
    const s = JSON.parse(localStorage.getItem(TKEY)) || {};
    // older versions kept a countdown with break and pause fields; only a running focus session carries over
    if(s.phase==="focus" && s.startedAt) return {phase:"focus", startedAt:s.startedAt, subject:s.subject, task:s.task, chimed:!!s.chimed, synced:!!s.synced};
    return {phase:"idle", subject:s.subject, task:s.task, lastEnded:s.lastEnded};
  }catch(e){ return {phase:"idle"}; }
}
// The running session is kept in her Firebase data (state/run), so every phone, tab and browser shows the same Start/Stop state.
// This copy in localStorage is only a cache for when the connection is down.
function cacheRun(){ try{ localStorage.setItem(TKEY, JSON.stringify(run)); }catch(e){} }
const runDoc = () => ({phase:"focus", startedAt:run.startedAt, subject:run.subject||"other", task:run.task||""});
let lastRunSync = 0;
async function syncRun(force){
  if(role!=="student" || asking) return;
  if(!force && Date.now()-lastRunSync < 10000) return;
  let remote = null;
  try{ remote = await store.getRun(); }catch(e){ console.error(e); return; }     // offline: keep what this device has
  lastRunSync = Date.now();
  if(remote && remote.phase==="focus" && remote.startedAt){
    if(run.phase==="idle" && run.lastEnded===remote.startedAt){ endRemote(); }   // this device already stopped it, but the delete had failed: retry
    else if(run.phase!=="focus" || run.startedAt!==remote.startedAt) run = {phase:"focus", startedAt:remote.startedAt, subject:remote.subject, task:remote.task, chimed:false, synced:true};
    else run.synced = true;
  } else if(run.phase==="focus"){
    if(run.synced) run = {phase:"idle", subject:run.subject, task:run.task, lastEnded:run.startedAt, note:"That session was already stopped on another device."};
    else { try{ await store.putRun(runDoc()); run.synced = true; }catch(e){ console.error(e); } }   // started offline or before this version: share it now
  }
  cacheRun();
}
async function endRemote(){ try{ await store.clearRun(); }catch(e){ console.error(e); } }
async function endRun(note){
  const started = run.startedAt;
  run = {phase:"idle", subject:run.subject, task:run.task, note, lastEnded:started};
  cacheRun();
  await endRemote();
}
let stopping = false;         // true while a Stop is being saved, so a double tap cannot log the run twice
let asking = null;           // set when Stop is pressed after a very long run: {elapsed, stopAt}
let audioCtx=null;
function beepPrime(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){} }
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.3].forEach((t,k)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=k?1046:784; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.15,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+t+0.5); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.5); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(200); }catch(e){}
}
const targetEnd = () => run.startedAt + CFG.focusMinutes*60000;
async function logSession(startIso, endIso, minutes){
  if(minutes < 1 || role!=="student") return;
  const d = todayStr(new Date(startIso));
  const day = await loadDay(d);
  if(day.sessions.some(s=>s.start===startIso)) return null;     // this run is already saved
  const entry = {id:uid(), start:startIso, end:endIso, minutes:Math.round(minutes), subject:run.subject||"other", task:run.task||""};
  try{ await store.addSession(d, entry); day.sessions.push(entry); saveErr=""; return entry; }catch(e){ console.error(e); saveErr="Could not save. Check your internet connection."; showSaveErr(); return null; }
}

// The celebration grows with how much she has studied that day, compared with the day's minimum target.
async function celebrate(entry){
  if(!entry || !earnsSticker(entry)) return;
  const day = await loadDay(todayStr(new Date(entry.start)));
  const ratio = minutesOf(day)/(targetOf(day)[0]*60);
  const lvl = ratio>=1 ? 4 : ratio>=.5 ? 3 : ratio>=.25 ? 2 : 1;
  const titles = {1:"Nice start!", 2:"Great going!", 3:"Fantastic!", 4:"Champion today!"};
  const ov = document.createElement("div");
  ov.className = "gift-ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","You earned a sticker");
  ov.innerHTML = `<div class="confetti" aria-hidden="true"></div>
    <div class="gift-card L${lvl}">${lvl===4?`<div class="gift-banner">Daily target reached</div>`:""}
      <div class="top">${titles[lvl]}</div>
      <div class="gift-emoji" aria-hidden="true">${stickerOf(entry.id)}</div>
      <p>You earned a new sticker for ${esc(hm(entry.minutes))} of focus.</p>
      <p class="small">${esc(hm(minutesOf(day)))} studied today</p>
      <button class="btn" id="giftok">Yay!</button>
    </div>`;
  document.body.appendChild(ov);
  const onKey = e=>{ if(e.key==="Escape") close(); };
  const close = ()=>{ ov.remove(); document.removeEventListener("keydown", onKey); };
  document.addEventListener("keydown", onKey);
  const ok = ov.querySelector("#giftok"); ok.onclick = close; ok.focus();
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = ov.querySelector(".confetti"), r = Math.random;
  box.innerHTML = Array.from({length:[0,14,40,70,110][lvl]}, ()=>`<i style="left:${r()*100}%;--dx:${Math.round((r()-.5)*160)}px;--rot:${Math.round(r()*720)}deg;animation-duration:${(2.2+r()*2).toFixed(2)}s;animation-delay:${(r()*.8).toFixed(2)}s"></i>`).join("");
  if(lvl===4){   // fireworks
    [[25,30,.1],[75,24,.5],[50,46,.9]].forEach(([x,y,delay])=>{
      const cols=["var(--gold)","var(--pink)","var(--accent)","var(--ok)"];
      for(let k=0;k<16;k++){ const a=k/16*Math.PI*2, sp=document.createElement("span"); sp.className="spark";
        sp.style.cssText=`left:${x}%;top:${y}%;background:${cols[k%4]};--bx:${Math.round(Math.cos(a)*90)}px;--by:${Math.round(Math.sin(a)*90)}px;animation-delay:${delay}s`; box.appendChild(sp); }
    });
  }
}
function refreshFocusViews(){
  if(asking) return;
  if(view.tab==="go" && !view.sub) render();
  if(view.tab==="today" && !view.sub) render();
}
function runTick(){
  if(run.phase!=="focus") return;
  const now = Date.now();
  // a session left running since an earlier day, and never stopped, is not counted
  if(todayStr(new Date(run.startedAt))!==todayStr() && now-run.startedAt > 6*3600000){
    endRun("Your session from "+fmtShort(todayStr(new Date(run.startedAt)))+" was not stopped, so it was not saved.").then(refreshFocusViews); return;
  }
  if(!run.chimed && now>=targetEnd()){
    run.chimed = true; cacheRun();
    if(now-targetEnd() < 120000) chime();      // only chime if she is here now, not when she comes back much later
    refreshFocusViews();
  }
}
setInterval(runTick, 15000);
document.addEventListener("visibilitychange", async ()=>{
  if(document.hidden) return;
  if(!role || !store || asking) return;
  await syncRun(true);
  runTick();
  // another device may have added entries while this one was in the background: drop the cache and reload
  for(const k in days) delete days[k];
  if(role==="parent"){ try{ const p=await store.getProgress(); if(p){ progress=p; progress.items=progress.items||{}; progress.mistakes=progress.mistakes||{}; } }catch(e){} }
  if(!view.sub && ["today","go","progress","study"].includes(view.tab)) render();
});

/* ================= routing ================= */
let view = {tab:"today", date:todayStr(), sub:null};
function go(v){ view = {...view, ...v}; render(); window.scrollTo(0,0); }
function setTabs(){
  const nav=document.getElementById("tabs"), inn=document.getElementById("tabsIn");
  const pr = hasPractice() ? [["practice","Practice"]] : [], st = hasStudy() ? [["study","Study"]] : [];
  const tabs = role==="student" ? [["today","Today"],["go","Let’s go"],...pr,...st,["progress","Progress"]]
                                : [["today","Day"],["progress","Week"],...pr,...st];
  inn.innerHTML = tabs.map(([k,l])=>`<button data-tab="${k}" ${view.tab===k?'aria-current="page"':""}>${l}</button>`).join("");
  inn.querySelectorAll("button").forEach(b=>b.onclick=async()=>{ if(role==="parent"){ try{ const p=await store.getProgress(); if(p){ progress=p; progress.items=progress.items||{}; progress.mistakes=progress.mistakes||{}; } }catch(e){} } go({tab:b.dataset.tab, sub:null, date: b.dataset.tab==="today"? (view.date||todayStr()) : view.date}); });
  nav.hidden = !!(view.sub && (view.sub.name==="quiz"||view.sub.name==="cards"||view.sub.name==="pdf"));
}
function header(title, subtitle){
  return `${DEMO?`<div class="banner">Demo mode: data is saved on this device only. Add your Firebase settings to config.js to go live.</div>`:""}
  <div class="spread"><div><h1>${esc(title)}</h1>${subtitle?`<p class="sub">${esc(subtitle)}</p>`:""}</div>
  ${(!DEMO && me)?`<button class="linkbtn" id="signout">Sign out</button>`:""}</div>
  ${role==="parent" && STUDENTS.length>1 ? `<div class="seg" role="group" aria-label="Student" style="margin-top:.6rem">${STUDENTS.map(x=>`<button data-stu="${esc(x.email)}" aria-pressed="${x.email===currentStudent}">${esc(x.name)}</button>`).join("")}</div>`:""}
  <p class="banner" id="saveerr" ${saveErr?"":"hidden"}>${esc(saveErr)}</p>`;
}
function bindHeader(){
  const so=document.getElementById("signout"); if(so) so.onclick=()=>authApi.signOut();
  app.querySelectorAll("[data-stu]").forEach(b=>b.onclick=()=>switchStudent(b.dataset.stu));
}
async function render(){
  if(!role) return;
  if((view.tab==="practice" && !hasPractice()) || (view.tab==="study" && !hasStudy())) view = {...view, tab:"today", sub:null};
  setTabs();
  const s = view.sub;
  if(s){
    if(s.name==="quiz") return renderQuiz();
    if(s.name==="result") return renderResult();
    if(s.name==="cards") return renderCards();
    if(s.name==="mistakes") return renderMistakes();
    if(s.name==="pdf") return renderPdf();
    if(s.name==="stickers") return renderStickers();
  }
  if(view.tab==="today") return renderToday();
  if(view.tab==="go") return renderGo();
  if(view.tab==="practice") return renderPractice();
  if(view.tab==="study") return renderStudy();
  if(view.tab==="progress") return renderProgress();
}

/* ================= TODAY ================= */
async function renderToday(){
  const d = view.date || todayStr();
  const isToday = d===todayStr(), tomorrow = addDays(todayStr(),1), isFuture = d>todayStr();
  const planEditable = role==="student" && (isToday || isFuture);   // she can plan today and tomorrow
  const editable = role==="student" && isToday;                       // ticking tasks off and carry-over are for today only
  const day = await loadDay(d, role==="parent");
  if(view.tab!=="today" || view.sub) return;
  const mins = minutesOf(day), [tmin,tmax] = targetOf(day);
  const pct = Math.min(100, mins/(tmin*60)*100);
  const done = day.tasks.filter(t=>t.done).length;
  let carryHtml = "";
  if(editable && !day.carried){
    const y = await loadDay(addDays(d,-1));
    const left = y.tasks.filter(t=>!t.done);
    if(left.length) carryHtml = `<button class="btn ghost small" id="carry">Bring over ${left.length} unfinished task${left.length===1?"":"s"} from yesterday</button>`;
  }
  const dueCount = chapterList().filter(c=>isDue(c.key)).length;
  const live = isToday && run.phase==="focus" ? `<p class="small">Studying now, since ${fmtTime(new Date(run.startedAt).toISOString())}.</p>` : "";
  const who = role==="parent" ? (studentName()+"’s day") : (isToday ? "Today" : isFuture ? "Tomorrow" : "Past day");
  app.innerHTML = `
    ${header(who, fmtLong(d))}
    <div class="daynav" style="margin-top:1rem">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <input class="field" type="date" id="pickDay" value="${d}" max="${tomorrow}" aria-label="Pick a date" style="flex:1">
      <button id="nextDay" aria-label="Next day" ${d>=tomorrow?"disabled":""}>›</button>
      ${isToday?"":`<button class="linkbtn" id="toToday" style="width:auto;border:0;background:none">Today</button>`}
    </div>
    <div class="seg" role="group" aria-label="Type of day" style="margin-top:.75rem">
      <button data-type="school" aria-pressed="${day.type==="school"}" ${planEditable?"":"disabled"}>School day</button>
      <button data-type="holiday" aria-pressed="${day.type==="holiday"}" ${planEditable?"":"disabled"}>Holiday</button>
    </div>
    <section class="panel" style="margin-top:1rem">
      <div class="hours"><strong>${hm(mins)}</strong><span class="sub">studied, target ${tmin}–${tmax} h</span></div>
      <div class="meter ${mins>=tmin*60?"done":""}"><i style="width:${pct}%"></i></div>
      <p class="small">${day.sessions.length} focus session${day.sessions.length===1?"":"s"}${mins>=tmin*60?", target reached":""}</p>
      ${live}
    </section>
    <h2>Study plan <span class="small">(${done} of ${day.tasks.length} done)</span></h2>
    <section class="panel">
      ${day.tasks.length? day.tasks.map(t=>`
        <div class="task ${t.done?"done":""}">
          <input type="checkbox" data-tid="${t.id}" ${t.done?"checked":""} ${editable?"":"disabled"} aria-label="Mark done">
          <div class="txt"><span>${esc(t.text)}</span> <span class="tag">${esc(SUBJECT_NAMES[t.subject]||"Other")}</span>${t.from?` <span class="small">from ${fmtShort(t.from)}</span>`:""}</div>
          ${planEditable?`<button class="del" data-del="${t.id}" aria-label="Delete task">×</button>`:""}
        </div>`).join("") : `<p class="small">${planEditable?(isFuture?"Plan tomorrow here.":"Add what you plan to study today."):"No plan written for this day."}</p>`}
      ${planEditable?`<form class="addform" id="addform">
        <select id="tsub" aria-label="Subject">${planSubjects().map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select>
        <input id="ttext" placeholder="e.g. Ch 3 Kirchhoff’s rules + NCERT exercises" aria-label="Task" autocomplete="off">
        <button class="btn small" type="submit">Add</button></form>`:""}
      ${carryHtml?`<div style="margin-top:.75rem">${carryHtml}</div>`:""}
    </section>
    ${role==="student" && hasPractice() && dueCount ? `<h2>Revision</h2><button class="duebtn" id="toPractice"><b>${dueCount} chapter${dueCount===1?"":"s"} due for revision</b><span>Open practice</span></button>`:""}
    ${day.sessions.length || (role==="parent" && !isFuture) ? `<h2>Study sessions</h2><section class="panel">${day.sessions.length?sessionsHtml(day):`<p class="small">No sessions on this day.</p>`}</section>`:""}
    ${role==="parent" && !isFuture ? `<div style="margin-top:.75rem"><div class="row"><button class="btn ghost small" id="addSess">Add a session</button><button class="btn ghost small" id="viewStickers">Stickers</button></div></div>
      <form class="panel stack" id="addForm" hidden style="margin-top:.75rem">
        <p class="small" style="margin:0">If she forgot to press Start or Stop, you can add the time she studied on ${esc(fmtShort(d))}. It will show as “Added by parent”.</p>
        <label class="fld">Started at<input class="field" type="time" id="asStart" value="17:00" required></label>
        <label class="fld">Minutes studied<input class="field" type="number" id="asMins" min="1" max="720" inputmode="numeric" required></label>
        <label class="fld">Subject<select class="field" id="asSubj">${planSubjects().map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select></label>
        <label class="fld">Note (optional)<input class="field" id="asNote" maxlength="80" autocomplete="off"></label>
        <p class="banner" id="asErr" hidden style="margin:0"></p>
        <div class="row"><button class="btn" type="submit">Save entry</button><button class="btn ghost" type="button" id="asCancel">Cancel</button></div>
      </form>`:""}
    ${versionLine()}`;
  bindHeader();
  document.getElementById("prevDay").onclick=()=>go({date:addDays(d,-1)});
  document.getElementById("nextDay").onclick=()=>{ if(d<tomorrow) go({date:addDays(d,1)}); };
  document.getElementById("pickDay").onchange=e=>{ const v=e.target.value; if(/^\d{4}-\d{2}-\d{2}$/.test(v) && v<=tomorrow) go({date:v}); else e.target.value=d; };
  const tt=document.getElementById("toToday"); if(tt) tt.onclick=()=>go({date:todayStr()});
  const tp=document.getElementById("toPractice"); if(tp) tp.onclick=()=>go({tab:"practice"});
  if(role==="parent" && !isFuture){
    const form=document.getElementById("addForm"), errEl=document.getElementById("asErr");
    document.getElementById("viewStickers").onclick=()=>go({sub:{name:"stickers"}});
    document.getElementById("addSess").onclick=()=>{ form.hidden=!form.hidden; if(!form.hidden) document.getElementById("asMins").focus(); };
    document.getElementById("asCancel").onclick=()=>{ form.hidden=true; errEl.hidden=true; };
    form.onsubmit=async e=>{
      e.preventDefault();
      const [hh,mm]=document.getElementById("asStart").value.split(":").map(Number), mins=parseInt(document.getElementById("asMins").value,10);
      const st=parseD(d); st.setHours(hh,mm,0,0);
      const endMs=st.getTime()+mins*60000;
      const fail=m=>{ errEl.textContent=m; errEl.hidden=false; };
      if(!(mins>=1 && mins<=720)) return fail("Enter the minutes studied, between 1 and 720.");
      if(endMs > Date.now()+60000) return fail("That session would end in the future. Check the start time and minutes.");
      const entry={id:uid(), start:st.toISOString(), end:new Date(endMs).toISOString(), minutes:mins, subject:document.getElementById("asSubj").value, task:document.getElementById("asNote").value.trim(), by:"parent", addedAt:new Date().toISOString()};
      try{ await store.addSession(d, entry); days[d].sessions.push(entry); render(); }
      catch(err){ console.error(err); fail("Could not save. Check your internet connection and try again."); }
    };
    app.querySelectorAll("[data-rmsess]").forEach(b=>b.onclick=async()=>{
      const entry=days[d].sessions.find(x=>x.id===b.dataset.rmsess); if(!entry || entry.by!=="parent") return;
      if(!confirm("Remove this entry you added?")) return;
      try{ await store.removeSession(d, entry); days[d].sessions=days[d].sessions.filter(x=>x.id!==entry.id); render(); }
      catch(err){ console.error(err); alert("Could not remove it. Check your internet connection and try again."); }
    });
  }
  if(editable){
    app.querySelectorAll("[data-tid]").forEach(c=>c.onchange=async()=>{ const t=day.tasks.find(x=>x.id===c.dataset.tid); t.done=c.checked; t.doneAt=c.checked?new Date().toISOString():null; await saveDay(d); render(); });
    const cb=document.getElementById("carry"); if(cb) cb.onclick=async()=>{
      const yd=addDays(d,-1), y=await loadDay(yd);
      y.tasks.filter(t=>!t.done).forEach(t=>day.tasks.push({id:uid(), text:t.text, subject:t.subject, done:false, from:t.from||yd, createdAt:new Date().toISOString()}));
      day.carried=true; await saveDay(d); render(); };
  }
  if(planEditable){
    app.querySelectorAll("[data-type]").forEach(b=>b.onclick=async()=>{ day.type=b.dataset.type; await saveDay(d); render(); });
    app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("Delete this task?")) return; day.tasks=day.tasks.filter(x=>x.id!==b.dataset.del); await saveDay(d); render(); });
    document.getElementById("addform").onsubmit=async e=>{ e.preventDefault(); const text=document.getElementById("ttext").value.trim(); if(!text) return;
      day.tasks.push({id:uid(), text, subject:document.getElementById("tsub").value, done:false, createdAt:new Date().toISOString()}); await saveDay(d); await render(); document.getElementById("ttext").focus(); };
  }
}
function sessionsHtml(day){
  return day.sessions.slice().sort((a,b)=>a.start<b.start?-1:1).map(s=>`<div class="session"><span>${fmtTime(s.start)} to ${fmtTime(s.end)}${s.task?`, ${esc(s.task)}`:""}</span><span><span class="tag">${esc(SUBJECT_NAMES[s.subject]||"Other")}</span>${s.by==="parent"?` <span class="tag">Added by parent</span>`:""} ${s.minutes} min${earnsSticker(s)?` <span class="gift" aria-hidden="true">${stickerOf(s.id)}</span>`:""}${role==="parent" && s.by==="parent"?` <button class="linkbtn" data-rmsess="${esc(s.id)}" aria-label="Remove this entry">Remove</button>`:""}</span></div>`).join("");
}

/* ================= STICKERS ================= */
async function renderStickers(){
  const t = todayStr(), dates = Array.from({length:30}, (_,k)=>addDays(t,-k));
  app.innerHTML = `<button class="linkbtn" id="back">Back</button><p class="sub">Loading…</p>`;
  document.getElementById("back").onclick = ()=>go({sub:null});
  const ds = await Promise.all(dates.map(d=>loadDay(d, role==="parent")));
  if(!view.sub || view.sub.name!=="stickers") return;
  const groups = []; let total = 0;
  dates.forEach((d,i)=>{ const st = ds[i].sessions.filter(earnsSticker).sort((a,b)=>a.start<b.start?-1:1); if(st.length){ groups.push([d,st]); total += st.length; } });
  app.innerHTML = `
    <button class="linkbtn" id="back">Back</button>
    <h1 style="margin-top:.5rem">${role==="parent" ? esc(studentName())+"’s stickers" : "My stickers"}</h1>
    <p class="sub">${total} sticker${total===1?"":"s"} in the last 30 days. Every focus session of ${GIFT_MIN} minutes or more earns one.</p>
    ${groups.length ? groups.map(([d,st])=>`<h2>${esc(fmtLong(d))}</h2><div class="stickers">${st.map(x=>`<div class="sticker"><span aria-hidden="true">${stickerOf(x.id)}</span><small>${esc(hm(x.minutes))}</small></div>`).join("")}</div>`).join("")
      : `<p class="panel" style="margin-top:1rem">No stickers yet. Study for ${GIFT_MIN} minutes or more and press Stop to earn the first one!</p>`}`;
  document.getElementById("back").onclick = ()=>go({sub:null});
}

/* ================= LET'S GO ================= */
async function renderGo(){
  await syncRun();
  const d=todayStr(), day=await loadDay(d);
  if(view.tab!=="go" || view.sub) return;
  const mins=minutesOf(day), [tmin]=targetOf(day);
  const openTasks = day.tasks.filter(t=>!t.done);
  const running = run.phase==="focus";
  const iso = ms => new Date(ms).toISOString();
  let main;
  if(asking){
    main = `<p class="goline">Welcome back!</p>
      <p style="text-align:center">You started at ${fmtTime(iso(run.startedAt))} and pressed Stop at ${fmtTime(iso(asking.stopAt))}. How many minutes did you actually study?</p>
      <form class="row" id="askform" style="justify-content:center">
        <input class="field" id="askmins" type="number" min="1" max="${asking.elapsed}" inputmode="numeric" required aria-label="Minutes studied" style="width:7rem">
        <button class="btn" type="submit">Save</button>
      </form>
      <div class="row" style="justify-content:center"><button class="linkbtn" id="dontsave">Don’t save this session</button><button class="linkbtn" id="keep">Keep going</button></div>`;
  } else if(running){
    const end=targetEnd(), past=Date.now()>=end;
    main = `<p class="goline">Focusing</p>
      <p class="sub" style="text-align:center">Started ${fmtTime(iso(run.startedAt))}. Focus until ${fmtTime(iso(end))}.</p>
      ${past?`<p class="goline ok">Nice work, ${CFG.focusMinutes} minutes done. Stop when you’re ready.</p>`:""}
      <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn" id="stop">Stop</button></div>`;
  } else {
    main = `<p class="goline">Ready when you are</p>
      ${run.note?`<p class="sub" style="text-align:center">${esc(run.note)}</p>`:""}
      <div class="row" style="justify-content:center;margin-top:1rem"><button class="btn" id="start">Start</button></div>`;
  }
  const lock = (running||asking) ? "disabled" : "";
  app.innerHTML = `
    ${header("Let’s go", "Press Start when you sit down to study and Stop when you finish.")}
    <section class="panel" style="margin-top:1rem">
      ${main}
      <div class="row" style="margin:.75rem 0 0">
        <select class="field" id="subj" aria-label="Subject" ${lock} style="flex:1">${planSubjects().map(([k,l])=>`<option value="${k}" ${run.subject===k?"selected":""}>${esc(l)}</option>`).join("")}</select>
        <select class="field" id="task" aria-label="Task" ${lock} style="flex:2"><option value="">No specific task</option>${openTasks.map(t=>`<option ${run.task===t.text?"selected":""}>${esc(t.text)}</option>`).join("")}</select>
      </div>
    </section>
    <h2>Today: ${hm(mins)} of ${tmin} h</h2>
    <section class="panel">${day.sessions.length?sessionsHtml(day):`<p class="small">Sessions you finish appear here and count towards today’s hours.</p>`}</section>
    <div class="row" style="margin-top:.75rem"><button class="btn ghost small" id="mystickers">My stickers</button></div>
    <p class="small">You can close the app while you study. When you come back, press Stop to save your time.</p>`;
  bindHeader();
  const subj=document.getElementById("subj"), task=document.getElementById("task");
  subj.onchange=()=>{ run.subject=subj.value; cacheRun(); };
  task.onchange=()=>{ run.task=task.value; const t=openTasks.find(x=>x.text===task.value); if(t){ run.subject=t.subject; subj.value=t.subject; } cacheRun(); };
  const b=id=>document.getElementById(id);
  b("mystickers").onclick=()=>go({sub:{name:"stickers"}});
  if(b("start")) b("start").onclick=async()=>{
    beepPrime();
    const sv=subj.value, tv=task.value;
    await syncRun(true);                                  // it may already be running on another device
    if(run.phase==="focus"){ render(); return; }
    run={phase:"focus", startedAt:Date.now(), chimed:false, subject:sv, task:tv};
    try{ await store.putRun(runDoc()); run.synced=true; }catch(e){ console.error(e); }
    cacheRun(); render(); };
  if(b("stop")) b("stop").onclick=async()=>{
    if(stopping) return; stopping=true;
    try{ await doStop(); } finally{ stopping=false; } };
  async function doStop(){
    await syncRun(true);
    if(run.phase!=="focus"){ render(); return; }           // already stopped on another device
    const now=Date.now(), elapsed=Math.round((now-run.startedAt)/60000);
    if(elapsed > (CFG.longSessionMinutes||120)){ asking={elapsed, stopAt:now}; render(); return; }
    let note;
    let entry = null;
    if(elapsed>=1){ entry = await logSession(iso(run.startedAt), iso(now), elapsed); note="Saved "+hm(elapsed)+". Well done! Take a short break."; }
    else note="That was under a minute, so it was not saved.";
    await endRun(note); render(); celebrate(entry);
  }
  if(b("askform")) b("askform").onsubmit=async e=>{ e.preventDefault();
    if(stopping) return; stopping=true;
    try{
      const m=parseInt(b("askmins").value,10); if(!(m>=1 && m<=asking.elapsed)) return;
      const entry = await logSession(iso(run.startedAt), iso(run.startedAt+m*60000), m);   // end = start + her answer, so the row never spans hours she did not study
      asking=null; await endRun("Saved "+hm(m)+". Well done! Take a short break."); render(); celebrate(entry);
    } finally{ stopping=false; } };
  if(b("dontsave")) b("dontsave").onclick=async()=>{ asking=null; await endRun("That session was not saved."); render(); };
  if(b("keep")) b("keep").onclick=()=>{ asking=null; render(); };
}

/* ================= PRACTICE ================= */
function renderPractice(){
  const t=todayStr(), list=chapterList();
  const due=list.filter(c=>isDue(c.key));
  const mcount=Object.keys(progress.mistakes).length;
  const student = role==="student";
  const bySubject = CONTENT.subjects.map(s=>{
    if(!s.chapters.length) return `<h2>${esc(s.name)}</h2><p class="small">Questions coming soon.</p>`;
    return `<h2>${esc(s.name)}</h2><div class="stack">${s.chapters.map(c=>{
      const key=s.id+"/"+c.n, it=item(key), lv=levelOf(key), levels=c.levels.length;
      let pill, line;
      if(!it){ pill=`<span class="pill new">Not started</span>`; line=`Level 1 of ${levels}`; }
      else{
        const last=it.attempts[it.attempts.length-1];
        const dd=it.next?diffDays(t,it.next):null;
        pill = isDue(key)?`<span class="pill due">Due</span>` : it.next===null ? `<span class="pill new">New level</span>` : `<span class="pill ok">Next in ${dd} day${dd===1?"":"s"}</span>`;
        const dots = Array.from({length:CFG.masteryInARow},(_,k)=>`<i class="${k<(it.streak||0)?"on":""}"></i>`).join("");
        line = it.allDone ? `All ${levels} level${levels===1?"":"s"} mastered. New questions needed.` :
          `Level ${lv+1} of ${levels}, mastery <span class="dots" aria-label="${it.streak||0} of ${CFG.masteryInARow}">${dots}</span>${last?`, last ${last.score}/${last.total} on ${fmtShort(last.date)}`:""}`;
      }
      return `<div class="panel ch"><div class="chnum">${c.n}</div><div><h3>${esc(c.t)}</h3><p class="status">${pill}${line}</p>
        ${student?`<div class="row"><button class="btn small" data-quiz="${key}">Quiz</button><button class="btn small ghost" data-cards="${key}">Flashcards</button></div>`:""}</div></div>`;
    }).join("")}</div>`;
  }).join("");
  app.innerHTML = `
    ${header(student?"Practice":studentName()+"’s practice", "Mastered = "+CFG.masteryScore+"/10 or more on "+CFG.masteryInARow+" revisions in a row")}
    ${due.length && student ? `<h2>Due today</h2><div class="stack">${due.map(c=>{ const late=diffDays(item(c.key).next,t); return `<button class="duebtn" data-quiz="${c.key}"><b>${esc(c.sname)} Ch ${c.n}: ${esc(c.t)}</b><span>${late>0?late+" day"+(late===1?"":"s")+" late":"due today"}</span></button>`; }).join("")}</div>`:""}
    <h2>Mistakes to fix</h2>
    <div class="panel spread"><div>${mcount?`<b>${mcount}</b> question${mcount===1?"":"s"} answered wrong. Answer once correctly to clear.`:"No mistakes saved."}</div>${mcount?`<button class="btn small" id="openM">${student?"Review":"View"}</button>`:""}</div>
    ${bySubject}`;
  bindHeader();
  app.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.quiz));
  app.querySelectorAll("[data-cards]").forEach(b=>b.onclick=()=>go({sub:{name:"cards", key:b.dataset.cards, i:0, flipped:false}}));
  const om=document.getElementById("openM"); if(om) om.onclick=()=>go({sub:{name:"mistakes"}});
}
function startQuiz(key){
  const it=item(key);
  const scheduled = !it || it.next===null || isDue(key);
  const qs=questionsFor(key).map(q=>({...q, order:shuffle([0,1,2,3])}));
  go({sub:{name:"quiz", mode:"chapter", key, scheduled, qs, idx:0, picked:null, showHint:false, answers:[]}});
}
function startMistakeQuiz(){
  const ids=shuffle(Object.keys(progress.mistakes)).filter(id=>{ const p=id.split("/"); try{ return !!chapterByKey(p[0]+"/"+p[1]).levels[+p[2]][+p[3]]; }catch(e){ return false; } });
  if(!ids.length) return go({sub:null});
  const qs=ids.map(id=>{ const p=id.split("/"); return {...qOf(p[0]+"/"+p[1], +p[2], +p[3]), order:shuffle([0,1,2,3])}; });
  go({sub:{name:"quiz", mode:"mistakes", qs, idx:0, picked:null, showHint:false, answers:[]}});
}
function renderQuiz(){
  const v=view.sub, q=v.qs[v.idx], total=v.qs.length, L=["A","B","C","D"];
  const c = v.mode==="chapter" ? chapterByKey(v.key) : null;
  const title = c ? `${c.sname} Ch ${c.n}: ${c.t}` : "Fixing mistakes";
  const opts=q.order.map((oi,pos)=>{ let cls="opt"; if(v.picked!==null){ if(oi===q.ans) cls+=" right"; else if(oi===v.picked) cls+=" wrong"; }
    return `<button class="${cls}" data-oi="${oi}" ${v.picked!==null?"disabled":""}><span class="k">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`; }).join("");
  let fb="";
  if(v.picked!==null){ const ok=v.picked===q.ans;
    fb=`<div class="feedback ${ok?"ok":"bad"}"><b>${ok?"Correct.":"Not quite. The answer is "+esc(q.opts[q.ans])+"."}</b>${esc(q.ex)}</div>
      <div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn" id="next">${v.idx+1<total?"Next question":"See result"}</button></div>`; }
  const hint = q.hint && v.picked===null ? (v.showHint?`<p class="hint">Hint: ${esc(q.hint)}</p>`:`<button class="linkbtn" id="hintbtn">Show a hint</button>`) : "";
  app.innerHTML = `
    <div class="spread"><button class="linkbtn" id="quit">Back</button><span class="sub">${v.idx+1} of ${total}</span></div>
    <h2 style="margin-top:.5rem">${esc(title)}</h2>
    ${v.mode==="chapter"?`<p class="small">${v.scheduled?"Revision: this attempt sets your next revision date.":"Extra practice: not due yet, so this won’t change your schedule."} Level ${q.level+1}.</p>`:""}
    <div class="bar"><i style="width:${v.idx/total*100}%"></i></div>
    <div class="panel"><p class="qtext">${esc(q.text)}</p><div class="stack">${opts}</div>${hint}${fb}</div>`;
  document.getElementById("quit").onclick=()=>{ if(!v.answers.length || confirm("Leave this quiz? This attempt won’t be saved.")) go({sub:v.mode==="mistakes"?{name:"mistakes"}:null}); };
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ v.picked=+b.dataset.oi; const ok=v.picked===q.ans; v.answers.push({q,ok});
    if(ok) delete progress.mistakes[q.id]; else { const m=progress.mistakes[q.id]||{count:0}; m.count++; m.last=todayStr(); progress.mistakes[q.id]=m; }
    saveProgress(); renderQuiz(); document.getElementById("next").focus(); });
  const hb=document.getElementById("hintbtn"); if(hb) hb.onclick=()=>{ v.showHint=true; renderQuiz(); };
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>{ if(v.idx+1<total){ v.idx++; v.picked=null; v.showHint=false; renderQuiz(); window.scrollTo(0,0); } else finishQuiz(); };
}
function finishQuiz(){
  const v=view.sub, score=v.answers.filter(a=>a.ok).length, total=v.answers.length, t=todayStr();
  let info=null;
  if(v.mode==="chapter"){
    const c=chapterByKey(v.key);
    const it=progress.items[v.key] || {level:0, stage:-1, next:null, streak:0, attempts:[]};
    const pct=score/total, I=CFG.intervals;
    it.attempts.push({date:t, score, total, level:v.qs[0].level, scheduled:v.scheduled});
    if(it.attempts.length>60) it.attempts=it.attempts.slice(-60);
    info={kind:"practice"};
    if(v.scheduled){
      const first = it.stage<0;
      if(first) it.stage = pct>=0.8?1:0;
      else if(pct>=0.8) it.stage=Math.min(it.stage+1, I.length-1);
      else if(pct<0.5) it.stage=0;
      if(!first) it.streak = score >= CFG.masteryScore*total/10 ? (it.streak||0)+1 : 0;
      it.next = addDays(t, I[it.stage]);
      info={kind:"scheduled", next:it.next, days:I[it.stage], pct, streak:it.streak||0};
      if((it.streak||0) >= CFG.masteryInARow && !it.allDone){
        if(it.level+1 < c.levels.length){
          it.level++; it.stage=-1; it.next=null; it.streak=0;
          info={kind:"levelup", level:it.level+1};
        } else {
          it.allDone=true; it.streak=CFG.masteryInARow; it.stage=I.length-1; it.next=addDays(t, I[I.length-1]);
          info={kind:"alldone", next:it.next};
        }
      }
    }
    progress.items[v.key]=it;
  }
  saveProgress();
  go({sub:{name:"result", mode:v.mode, key:v.key, score, total, wrong:v.answers.filter(a=>!a.ok).map(a=>a.q), info}});
}
function renderResult(){
  const v=view.sub, i=v.info;
  let msg="";
  if(v.mode==="chapter"){
    if(i.kind==="levelup") msg=`<p><b>Level mastered.</b> Level ${i.level} is now unlocked with new questions. Start it whenever you’re ready.</p>`;
    else if(i.kind==="alldone") msg=`<p><b>Every level in this chapter is mastered.</b> It will come back for a check on ${fmtShort(i.next)}. Ask for new questions to keep going.</p>`;
    else if(i.kind==="scheduled") msg=`<p>${i.pct>=0.8?"Strong recall.":i.pct>=0.5?"Getting there.":"This chapter needs another look soon."} Next revision: <b>${fmtShort(i.next)}</b>. Mastery progress: ${i.streak} of ${CFG.masteryInARow}.</p>`;
    else msg=`<p>Extra practice saved. Your revision schedule is unchanged.</p>`;
  } else { const left=Object.keys(progress.mistakes).length; msg=`<p>${left?left+" mistake"+(left===1?"":"s")+" still to fix.":"All mistakes cleared."}</p>`; }
  const c = v.key ? chapterByKey(v.key) : null;
  app.innerHTML=`
    <button class="linkbtn" id="home">Back to practice</button>
    <div class="panel" style="margin-top:.75rem"><h2 style="margin-top:0">${c?esc(c.sname+" Ch "+c.n+": "+c.t):"Fixing mistakes"}</h2>
      <p class="score">${v.score}<small> / ${v.total}</small></p>${msg}
      <div class="row">${v.wrong.length?`<button class="btn" id="fix">Practise wrong ones now</button>`:""}<button class="btn ghost" id="done">Done</button></div></div>
    ${v.wrong.length?`<h2>Review these</h2><div class="stack">${v.wrong.map(q=>`<div class="wq"><p><b>${esc(q.text)}</b></p><p class="ans">${esc(q.opts[q.ans])}</p><p class="ex">${esc(q.ex)}</p></div>`).join("")}</div>`:""}`;
  document.getElementById("home").onclick=()=>go({sub:null});
  document.getElementById("done").onclick=()=>go({sub:null});
  const f=document.getElementById("fix"); if(f) f.onclick=startMistakeQuiz;
}
function renderCards(){
  const v=view.sub, c=chapterByKey(v.key), qs=questionsFor(v.key), q=qs[v.i], total=qs.length;
  app.innerHTML=`
    <div class="spread"><button class="linkbtn" id="back">Back</button><span class="sub">${v.i+1} of ${total}</span></div>
    <h2 style="margin-top:.5rem">${esc(c.sname)} Ch ${c.n}: ${esc(c.t)}</h2>
    <div class="panel card" id="card" role="button" tabindex="0" aria-label="Flip card">${v.flipped
      ?`<div class="lbl">Answer</div><div class="ans">${esc(q.opts[q.ans])}</div><div class="ex">${esc(q.ex)}</div>`
      :`<div class="lbl">Question ${v.i+1}, level ${q.level+1}</div><div class="big">${esc(q.text)}</div>`}</div>
    <p class="small" style="text-align:center">Tap the card to ${v.flipped?"see the question":"reveal the answer"}</p>
    <div class="spread"><button class="btn ghost" id="prev" ${v.i===0?"disabled":""}>Previous</button><button class="btn" id="nxt">${v.i+1<total?"Next card":"Finish"}</button></div>`;
  const flip=()=>{ v.flipped=!v.flipped; renderCards(); document.getElementById("card").focus(); };
  const card=document.getElementById("card"); card.onclick=flip; card.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } };
  document.getElementById("back").onclick=()=>go({sub:null});
  document.getElementById("prev").onclick=()=>{ if(v.i>0){ v.i--; v.flipped=false; renderCards(); } };
  document.getElementById("nxt").onclick=()=>{ if(v.i+1<total){ v.i++; v.flipped=false; renderCards(); } else go({sub:null}); };
}
function renderMistakes(){
  const ids=Object.keys(progress.mistakes).sort();
  const rows=ids.map(id=>{ const p=id.split("/"); let q; try{ q=qOf(p[0]+"/"+p[1], +p[2], +p[3]); }catch(e){ return ""; }
    const c=chapterByKey(q.key), m=progress.mistakes[id];
    return `<div class="wq"><p class="small">${esc(c.sname)} Ch ${c.n}, level ${q.level+1}</p><p><b>${esc(q.text)}</b></p><p class="ans">${esc(q.opts[q.ans])}</p><p class="ex">${esc(q.ex)}</p><p class="ex">Wrong ${m.count} time${m.count===1?"":"s"}, last on ${fmtShort(m.last)}</p></div>`; }).join("");
  app.innerHTML=`
    <button class="linkbtn" id="back">Back</button>
    <h1 style="margin-top:.5rem">Mistakes to fix</h1>
    <p class="sub">A question leaves this list once it is answered correctly.</p>
    ${role==="student"&&ids.length?`<div class="row" style="margin:1rem 0"><button class="btn" id="pr">Practise all ${ids.length}</button></div>`:""}
    <div class="stack" style="margin-top:1rem">${rows||`<p>No mistakes saved.</p>`}</div>`;
  document.getElementById("back").onclick=()=>go({sub:null});
  const pr=document.getElementById("pr"); if(pr) pr.onclick=startMistakeQuiz;
}

/* ================= STUDY ================= */
const MATERIALS = window.MATERIALS || [];
const MAT_KINDS = [["notes","Revision notes"],["formulas","Formula sheets"]];
function renderStudy(){
  const sections = MAT_KINDS.map(([k,label])=>{
    const items = MATERIALS.filter(m=>m.kind===k && subjectIds().includes(m.subject));
    if(!items.length) return "";
    return `<h2>${esc(label)}</h2><div class="stack">${items.map(m=>`<button class="mat" data-mat="${MATERIALS.indexOf(m)}"><b>${esc(m.title)}</b><span>${esc(SUBJECT_NAMES[m.subject]||"")}, PDF</span></button>`).join("")}</div>`;
  }).join("");
  app.innerHTML = `
    ${header("Study", "Revision notes and formula sheets")}
    ${sections || `<p class="small" style="margin-top:1rem">No study material added yet.</p>`}
    ${versionLine()}`;
  bindHeader();
  app.querySelectorAll("[data-mat]").forEach(b=>b.onclick=()=>{ const m=MATERIALS[+b.dataset.mat]; go({sub:{name:"pdf", file:m.file, title:m.title, chapters:m.chapters||null, zoom:1}}); });
}
// PDFs are drawn with pdf.js (pinned version), because phone browsers cannot show PDFs inside a page reliably.
const PDFJS_VER = "3.11.174";
let pdfJsLoading = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfJsLoading) pdfJsLoading = new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`;
    sc.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`; res(window.pdfjsLib); };
    sc.onerror=()=>{ pdfJsLoading=null; rej(new Error("pdf.js did not load")); };
    document.head.appendChild(sc);
  });
  return pdfJsLoading;
}
async function renderPdf(){
  const v=view.sub;
  app.innerHTML = `
    <div class="pdfbar">
      <div class="spread"><button class="linkbtn" id="back">Back</button><span class="small" id="pdfstate">Loading…</span><a class="linkbtn" href="${esc(v.file)}" target="_blank" rel="noopener">Open original</a></div>
      <h2>${esc(v.title)}</h2>
      <div class="row" style="flex-wrap:nowrap">
        <select class="field" id="outsel" aria-label="Chapters" hidden style="flex:1"></select>
        <select class="field" id="pgsel" aria-label="Go to page" hidden></select>
        <button class="btn small ghost" id="zout" aria-label="Zoom out">−</button>
        <button class="btn small ghost" id="zin" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="pdfscroll"><div id="pages"></div></div>`;
  document.getElementById("back").onclick=()=>go({sub:null});
  const state=document.getElementById("pdfstate"), pages=document.getElementById("pages");
  let doc;
  try{ const lib=await loadPdfJs(); doc=await lib.getDocument(v.file).promise; }
  catch(e){ console.error(e); if(view.sub===v) state.textContent="Could not open. Try Open original."; return; }
  if(view.sub!==v) return;
  const N=doc.numPages, first=await doc.getPage(1), vp0=first.getViewport({scale:1});
  const holders=[], rendered=new Set();
  for(let i=1;i<=N;i++){ const d=document.createElement("div"); d.className="pdfpage"; d.dataset.p=i; d.style.aspectRatio=vp0.width+" / "+vp0.height; pages.appendChild(d); holders.push(d); }
  const renderPage=async d=>{
    const n=+d.dataset.p; if(rendered.has(n)) return; rendered.add(n);
    try{
      const pg=await doc.getPage(n), base=pg.getViewport({scale:1}), dpr=Math.min(window.devicePixelRatio||1,2.5);
      const vp=pg.getViewport({scale:pages.clientWidth/base.width*dpr});
      const cv=document.createElement("canvas"); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
      await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
      if(view.sub!==v || !rendered.has(n)) return;
      d.style.aspectRatio=""; d.replaceChildren(cv);
    }catch(e){ console.error(e); rendered.delete(n); }
  };
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) renderPage(e.target); }),{rootMargin:"800px 0px"});
  const refresh=()=>{ io.disconnect(); rendered.clear(); pages.style.width=(v.zoom*100)+"%";
    holders.forEach(d=>{ d.replaceChildren(); d.style.aspectRatio=vp0.width+" / "+vp0.height; io.observe(d); }); };
  refresh();
  // page menu and page counter
  const pgsel=document.getElementById("pgsel");
  pgsel.innerHTML=Array.from({length:N},(_,k)=>`<option value="${k}">Page ${k+1}</option>`).join(""); pgsel.hidden=false;
  const goTo=i=>holders[Math.max(0,Math.min(N-1,i))].scrollIntoView({block:"start"});
  pgsel.onchange=()=>goTo(+pgsel.value);
  let ticking=false;
  const onScroll=()=>{
    if(view.sub!==v){ window.removeEventListener("scroll",onScroll); return; }
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{ ticking=false; let cur=0; for(let i=0;i<N;i++){ cur=i; if(holders[i].getBoundingClientRect().bottom>140) break; }
      state.textContent="Page "+(cur+1)+" of "+N; pgsel.value=cur; });
  };
  window.addEventListener("scroll",onScroll,{passive:true}); onScroll();
  document.getElementById("zin").onclick=()=>{ v.zoom=Math.min(3,v.zoom+0.5); refresh(); };
  document.getElementById("zout").onclick=()=>{ v.zoom=Math.max(1,v.zoom-0.5); refresh(); };
  // chapter menu: the list given in content.js, or else the PDF's own bookmarks
  const fillMenu=(label,items)=>{
    const os=document.getElementById("outsel");
    os.innerHTML=`<option value="">${label}</option>`+items.map(x=>`<option value="${x.i}">${x.depth?"– ":""}${esc(x.t)}</option>`).join(""); os.hidden=false;
    os.onchange=()=>{ if(os.value!=="") goTo(+os.value); os.value=""; };
  };
  if(v.chapters && v.chapters.length){ fillMenu("Chapters", v.chapters.map(([t,pg])=>({t,i:pg-1,depth:0}))); return; }
  try{
    const ol=await doc.getOutline();
    if(ol && ol.length && view.sub===v){
      const items=[];
      const walk=async(list,depth)=>{ for(const it of list){
        let dest=it.dest; if(typeof dest==="string") dest=await doc.getDestination(dest);
        if(dest){ const idx=typeof dest[0]==="number" ? dest[0] : await doc.getPageIndex(dest[0]); items.push({t:it.title,i:idx,depth}); }
        if(it.items && it.items.length && depth<1) await walk(it.items,depth+1); } };
      await walk(ol,0);
      if(items.length && view.sub===v) fillMenu("Contents", items);
    }
  }catch(e){ console.error(e); }
}

/* ================= PROGRESS ================= */
async function renderProgress(){
  const t=todayStr();
  const dates=Array.from({length:7},(_,k)=>addDays(t,k-6));
  const ds=await Promise.all(dates.map(d=>loadDay(d, role==="parent")));
  if(view.tab!=="progress" || view.sub) return;
  const totalMin=ds.reduce((a,d)=>a+minutesOf(d),0);
  const targetMin=ds.reduce((a,d)=>a+targetOf(d)[0]*60,0);
  const tasksDone=ds.reduce((a,d)=>a+d.tasks.filter(x=>x.done).length,0), tasksAll=ds.reduce((a,d)=>a+d.tasks.length,0);
  const metDays=ds.filter(d=>minutesOf(d)>=targetOf(d)[0]*60).length;
  const maxH=Math.max(...ds.map(d=>Math.max(minutesOf(d)/60, targetOf(d)[1])),1);
  const bySub={}; ds.forEach(d=>d.sessions.forEach(s=>{ bySub[s.subject]=(bySub[s.subject]||0)+s.minutes; }));
  const list=chapterList().filter(c=>item(c.key));
  app.innerHTML=`
    ${header(role==="student"?"Progress":studentName()+"’s week", "Last 7 days")}
    <div class="stats" style="margin-top:1rem">
      <div class="stat"><strong>${(totalMin/60).toFixed(1)} h</strong><span>studied of ${(targetMin/60).toFixed(0)} h target</span></div>
      <div class="stat"><strong>${metDays}/7</strong><span>days target met</span></div>
      <div class="stat"><strong>${tasksAll?Math.round(tasksDone/tasksAll*100):0}%</strong><span>plan completed (${tasksDone}/${tasksAll})</span></div>
    </div>
    <h2>Daily hours</h2>
    <section class="panel">${ds.map((d,k)=>{ const h=minutesOf(d)/60, [tmin]=targetOf(d);
      return `<div class="weekrow"><span>${k===6?"Today":fmtDow(dates[k])}<br><span class="small">${d.type==="holiday"?"Holiday":"School"}</span></span>
        <div class="meter ${h>=tmin?"done":""}" style="height:14px"><i style="width:${h/maxH*100}%"></i><span class="tgt" style="left:${tmin/maxH*100}%" title="Target ${tmin} h"></span></div>
        <span>${h.toFixed(1)} h<br><span class="small">${d.tasks.filter(x=>x.done).length}/${d.tasks.length} tasks</span></span></div>`; }).join("")}
      <p class="small">The thin line on each bar marks that day’s minimum target.</p></section>
    ${Object.keys(bySub).length?`<h2>Time by subject</h2><section class="panel">${Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,m])=>`<div class="session"><span>${esc(SUBJECT_NAMES[s]||"Other")}</span><span>${hm(m)}</span></div>`).join("")}</section>`:""}
    <h2>Chapters practised</h2>
    <section class="panel">${list.length?`<div class="tablewrap"><table class="prog"><thead><tr><th>Chapter</th><th>Level</th><th>Mastery</th><th>Last</th><th>Next</th></tr></thead><tbody>${list.map(c=>{ const it=item(c.key), last=it.attempts[it.attempts.length-1];
      return `<tr><td>${esc(c.sname.slice(0,4))} ${c.n}: ${esc(c.t)}</td><td>${it.allDone?"All":it.level+1}</td><td>${it.allDone?"Done":(it.streak||0)+"/"+CFG.masteryInARow}</td><td>${last?last.score+"/"+last.total:"–"}</td><td>${it.next?(isDue(c.key)?"Due":fmtShort(it.next)):"New level"}</td></tr>`; }).join("")}</tbody></table></div>`:`<p class="small">No quizzes taken yet.</p>`}
      <p class="small" style="margin-top:.5rem">${Object.keys(progress.mistakes).length} mistakes waiting to be fixed.</p></section>`;
  bindHeader();
}

/* ================= boot ================= */
function showLogin(msg){
  document.getElementById("tabs").hidden=true;
  app.innerHTML=`<div class="login"><h1>Study Desk</h1><p class="sub">Daily plan, study sessions and revision practice.</p>
    ${msg?`<p class="banner">${esc(msg)}</p>`:""}
    <div><button class="btn" id="gsign">Sign in with Google</button></div></div>`;
  document.getElementById("gsign").onclick=()=>authApi.signIn();
}
async function startAs(r){
  role=r;
  try{ progress = (await store.getProgress()) || blankProgress(); }catch(e){ console.error(e); progress=blankProgress(); saveErr="Could not load saved data. Check your internet connection."; }
  progress.items=progress.items||{}; progress.mistakes=progress.mistakes||{};
  view={tab:"today", date:todayStr(), sub:null};
  if(role==="student"){ await syncRun(true); runTick(); }
  render();
}
async function boot(){
  if(DEMO){ makeStore = async e=>localStore(e); currentStudent=STUDENTS[0].email; store=await makeStore(currentStudent); me=null; return startAs("student"); }
  try{
    const fa=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
    const au=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`);
    const fs=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`);
    const fapp=fa.initializeApp(CFG.firebase), auth=au.getAuth(fapp), db=fs.getFirestore(fapp);
    authApi={
      signIn: async()=>{ const p=new au.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
        try{ await au.signInWithPopup(auth,p); }catch(e){ if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) await au.signInWithRedirect(auth,p); else showLogin("Sign-in did not complete. Please try again."); } },
      signOut: async()=>{ await au.signOut(auth); }
    };
    makeStore = e=>firebaseStore(fs, db, e);
    au.onAuthStateChanged(auth, async user=>{
      role=null; currentStudent=null; for(const k in days) delete days[k];
      if(!user){ me=null; const m=loginMsg; loginMsg=""; return showLogin(m); }
      me=user; const email=(user.email||"").toLowerCase();
      if(STUDENTS.some(x=>x.email===email)){ currentStudent=email; store=await makeStore(email); return startAs("student"); }
      if(PARENTS.includes(email)){
        let last=null; try{ last=localStorage.getItem("study-desk-parent-student"); }catch(e){}
        currentStudent = STUDENTS.some(x=>x.email===last) ? last : STUDENTS[0].email;
        store=await makeStore(currentStudent); return startAs("parent");
      }
      loginMsg=`${email} is not set up for this app. Sign in with a student or parent Google account.`;
      await au.signOut(auth);
    });
  }catch(e){ console.error(e); app.innerHTML=`<p class="banner">Could not load. Check your internet connection and the Firebase settings in config.js.</p>`; }
}
boot();
